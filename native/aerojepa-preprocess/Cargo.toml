[package]
name = "aerojepa-preprocess"
version = "0.1.0"
edition = "2021"
description = "Optional Rust video preprocess accelerator for AeroJEPA"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "aerojepa_preprocess"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

