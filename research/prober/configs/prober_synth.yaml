# AeroProber training config (regular predictor baseline).
# Used by scripts/train_prober.py.
checkpoint: checkpoints/baseline/latest.pt   # regular (non-looped) world model
predictor_mode: regular                        # regular | looped
max_loops: 1                                    # ignored for regular; 1=single-pass on looped ckpts

# Data
data:
  num_train: 256
  num_val: 32
  num_frames: 8
  img_size: 64
  batch_size: 16
  num_workers: 0                                # PyFlyt is not fork-safe
  seed: 0

# Prober / integrator
prober:
  hidden_dim: 24
  num_layers: 2
integrator:
  dt: 0.0667                                    # 1/15 s (Parrot Wilds framerate)
  gravity: -9.81

# Training
train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  context_frames: 4                             # first 4 frames -> predict last 4

# Output
output_dir: research/prober/results/prober_regular
device: mps                                     # mps | cpu
