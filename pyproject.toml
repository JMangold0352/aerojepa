[project]
name = "aerojepa"
version = "0.1.0"
description = "AeroJEPA: recurrent video world models for embodied UAV autonomy, extending the Looped-JEPA predictor to the temporal domain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research and educational use" }
authors = [{ name = "John Mangold" }]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
demo = ["gradio>=4.0.0"]
viz = ["scikit-learn>=1.4.0"]
video = ["opencv-python>=4.9.0"]
sim = ["PyFlyt>=0.20.0"]
# Optional Rust ingest accelerator (see docs/NATIVE_PREPROCESS.md).
# Build the wheel separately: cd native/aerojepa-preprocess && maturin develop --release
native = ["maturin>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerojepa"]

[tool.hatch.build.targets.wheel.sources]
"src/aerojepa" = "aerojepa"

[tool.pytest.ini_options]
testpaths = ["tests", "research/prober/tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that spin up PyFlyt or load checkpoints",
]
